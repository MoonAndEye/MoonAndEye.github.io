<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1f2937">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="630" fill="#ffffff"/>

  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="600">Pi 的回圈：每一輪結束，看有沒有工具呼叫、有沒有人排隊</text>

  <!-- run bracket -->
  <path d="M 48 50 H 40 V 536 H 48" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text transform="translate(28 293) rotate(-90)" text-anchor="middle" font-size="12.5" fill="#475569">一趟（run）：從送出 prompt 到停下來</text>

  <!-- turn bracket -->
  <path d="M 326 126 H 318 V 372 H 326" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="305" y="236" text-anchor="end" font-size="13" font-weight="600" fill="#475569">一輪（turn）</text>
  <text x="305" y="256" text-anchor="end" font-size="12.5" fill="#475569">一次模型回應</text>
  <text x="305" y="274" text-anchor="end" font-size="12.5" fill="#475569">加上它引發的工具執行</text>

  <!-- start -->
  <rect x="380" y="50" width="200" height="44" rx="22" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="480" y="72" text-anchor="middle" dominant-baseline="middle">你送出 prompt</text>
  <line x1="480" y1="94" x2="480" y2="124" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- call model -->
  <rect x="380" y="126" width="200" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="151" text-anchor="middle" dominant-baseline="middle" font-weight="600">叫模型</text>
  <line x1="480" y1="176" x2="480" y2="210" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- decision 1 -->
  <polygon points="330,262 480,212 630,262 480,312" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="480" y="262" text-anchor="middle" dominant-baseline="middle">回應裡有工具呼叫？</text>

  <!-- yes -> run tool -->
  <line x1="630" y1="262" x2="698" y2="262" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="253" text-anchor="middle" font-size="12.5" fill="#475569">有</text>
  <rect x="700" y="237" width="170" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="785" y="262" text-anchor="middle" dominant-baseline="middle" font-weight="600">執行工具</text>
  <line x1="785" y1="287" x2="785" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="700" y="322" width="170" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="785" y="347" text-anchor="middle" dominant-baseline="middle">結果接回對話</text>

  <!-- loop back to call model -->
  <polyline points="870,347 930,347 930,151 582,151" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="755" y="143" text-anchor="middle" font-size="12.5" fill="#475569">再問模型一次</text>

  <!-- no -> decision 2 -->
  <line x1="480" y1="312" x2="480" y2="350" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="496" y="336" font-size="12.5" fill="#475569">沒有</text>
  <polygon points="330,402 480,352 630,402 480,452" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="480" y="402" text-anchor="middle" dominant-baseline="middle">有排隊的話？</text>

  <!-- yes -> queued message -->
  <line x1="630" y1="402" x2="698" y2="402" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="393" text-anchor="middle" font-size="12.5" fill="#475569">有</text>
  <rect x="700" y="377" width="170" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="785" y="402" text-anchor="middle" dominant-baseline="middle">把排隊的話放進對話</text>
  <polyline points="870,402 930,402 930,347" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- no -> stop -->
  <line x1="480" y1="452" x2="480" y2="490" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="496" y="476" font-size="12.5" fill="#475569">沒有</text>
  <rect x="430" y="492" width="100" height="44" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="480" y="514" text-anchor="middle" dominant-baseline="middle" font-weight="600">停</text>

  <!-- note: queue kinds -->
  <rect x="640" y="468" width="290" height="140" rx="6" fill="#fafafa" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="654" y="490" font-size="12.5" font-weight="600" fill="#475569">排隊的話有兩種</text>
  <text x="654" y="510" font-size="12.5" fill="#475569">steer：做事中途插進來的話，這一輪</text>
  <text x="654" y="528" font-size="12.5" fill="#475569">結束、下一次叫模型之前放進對話</text>
  <text x="654" y="548" font-size="12.5" fill="#475569">follow-up：原本該停的那一刻，發現</text>
  <text x="654" y="566" font-size="12.5" fill="#475569">還有這句，再轉一輪</text>
  <text x="654" y="588" font-size="12.5" fill="#475569">兩種都有的時候，先 steer</text>

  <!-- note: other stops -->
  <text x="60" y="574" font-size="12.5" font-weight="600" fill="#475569">另外兩種停法</text>
  <text x="60" y="594" font-size="12.5" fill="#475569">工具結果帶 terminate 標記（同一批工具全都說停，回圈才停），或外面直接中止</text>
</svg>
